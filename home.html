<!DOCTYPE html>
<html lang="en" class="bg-[#F8FAFC]">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Github Issue Tracker</title>
    <link rel="shortcut icon" href="./images/favicon.png" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" />
    <style>
        * {
            font-family: "Geist", sans-serif;
        }
    </style>
</head>

<body>

    <header>
        <div class="navbar bg-base-100 shadow-sm fixed top-0 flex-row z-50">
            <div class="navbar mx-auto w-11/12">
                <div class="flex-1 flex items-center gap-1">
                    <img class="w-9 h-[37px]" src="./images/github-logo.png" alt="">
                    <a class="text-[24px] font-bold">GitHub Issues Tracker</a>
                </div>
                <div class="flex gap-2 flex-col lg:flex-row">
                    <label class="input">
                        <svg class="h-[1em] opacity-50" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                            <g stroke-linejoin="round" stroke-linecap="round" stroke-width="2.5" fill="none"
                                stroke="currentColor">
                                <circle cx="11" cy="11" r="8"></circle>
                                <path d="m21 21-4.3-4.3"></path>
                            </g>
                        </svg>
                        <input id="search-input" type="search" required placeholder="Search" />
                    </label>
                    <button id="search-btn" class="btn btn-primary"><i class="fa-solid fa-magnifying-glass"></i>
                        Search</button>
                    <button id="logout" class="btn bg-red-600 text-white"><i
                            class="fa-solid fa-arrow-right-from-bracket fa-rotate-180"></i>Logout</button>
                </div>
            </div>
        </div>
    </header>

    <section id="btn-section" class="w-10/12 bg-white mx-auto mt-[150px] mb-4 shadow-sm rounded-2xl">
        <div class="flex gap-2 flex-col md:flex-row lg:flex-row px-6 py-6">
            <button onclick="switchTab('all')" id="tab-all"
                class="btn text-white bg-primary px-[50px] py-3">All</button>
            <button onclick="switchTab('open')" id="tab-open"
                class="btn px-[50px] py-3 bg-transparent text-black hover:bg-gray-200">Open</button>
            <button onclick="switchTab('close')" id="tab-close"
                class="btn px-[50px] py-3 bg-transparent text-black hover:bg-gray-200">Closed</button>
        </div>
    </section>

    <dialog id="card_modal" class="modal modal-bottom sm:modal-middle">
        <div class="modal-box max-w-[574px] p-6 relative">
            <form method="dialog">
                <button class="btn btn-sm btn-circle btn-ghost absolute right-2 top-2">✕</button>
            </form>
            <div id="details-card"></div>
        </div>
    </dialog>

    <section class="w-10/12 mx-auto">
        <div class="flex justify-between bg-white shadow p-6 rounded-t-xl">
            <div class="flex items-center gap-2">
                <img src="./images/Aperture.png" alt="">
                <div>
                    <h2 id="issue-count" class="text-[20px] font-semibold">0 Issues</h2>
                    <p class="text-[#64748B]">Track and manage your project issues</p>
                </div>
            </div>
            <div class="flex gap-4">
                <div class="flex items-center gap-1">
                    <i class="fa-solid fa-circle" style="color: rgb(168, 85, 247);"></i>
                    <p class="font-medium">Closed</p>
                </div>
                <div class="flex items-center gap-1">
                    <i class="fa-solid fa-circle" style="color: rgb(0, 169, 110);"></i>
                    <p class="font-medium">Open</p>
                </div>
            </div>
        </div>
    </section>

    <hr class="w-10/12 mx-auto text-[#d7d7dd]">

    <section id="spinner" class="justify-self-center text-center hidden mt-5">
        <span class="loading loading-spinner loading-xl"></span>
        <p class="text-[#737579]">Loading issues......</p>
    </section>

    <section id="data-container"
        class="w-10/12 mx-auto p-6 shadow-md grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-3 rounded-b-2xl mb-7">
    </section>

    <section id="open-container"
        class="hidden w-10/12 mx-auto p-6 shadow-md grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-3 rounded-b-2xl mb-7">
    </section>

     <section id="close-container"
        class="hidden w-10/12 mx-auto p-6 shadow-md grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-3 rounded-b-2xl mb-7">
    </section>

    <script src="./home.js"></script>
</body>

</html>
